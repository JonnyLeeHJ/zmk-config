# Uncomment the following line to enable deep sleep
# CONFIG_ZMK_SLEEP=y

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Disable the 2Mbps PHY. Some Realtek and Intel Bluetooth chipsets on Windows
# negotiate it badly and pairing fails partway through bonding. The host PC
# here uses a Realtek USB dongle that hit exactly this.
CONFIG_BT_CTLR_PHY_2M=n

# Enable eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# ZMK Studio is deliberately off. With it enabled the keymap is served from
# settings storage, which silently overrides the keymap in this repo and
# survives a reflash. This file and corne.keymap are the source of truth.
CONFIG_ZMK_STUDIO=n

# Display: zmk-nice-oled module (nice_epaper shield in build.yaml).
# Luna the dog on the central, animated status on the peripheral.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
# The module's bongo cat defaults to y and defines the same symbols as Luna,
# so exactly one of the two may be enabled.
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n

# Luna reads a rolling WPM average, so she can never react per keystroke;
# a faster frame tick (default 300) is the lever that makes her feel alive.
CONFIG_NICE_OLED_WIDGET_WPM_LUNA_ANIMATION_MS=150

# Fill the empty area under Luna with the live WPM graph.
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y

# Modifier indicators off: the strip renders partially off-canvas on the
# e-paper layout (letters clipped at the edge).
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n

# WPM number under the graph, as in the module's demo.
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y

# Raise the display thread priority (5 to 3) and stack (2560 to 4096).
# Without this, typing starves the display thread and Luna's animation
# freezes mid-typing, resuming only when the hands stop.
CONFIG_NICE_OLED_WIDGET_RESPONSIVE=y

# Uncomment the following line to enable USB Logging (this increases power usage by a significant amount, turn it off when not in use)
# CONFIG_ZMK_USB_LOGGING=y
