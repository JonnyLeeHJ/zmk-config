manifest:
  defaults:
    revision: v0.3
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: mctechnology17
      url-base: https://github.com/mctechnology17
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    # Display widgets: Luna WPM animation on the central, animations on the
    # peripheral. Tested by its author against ZMK v0.3.0, our exact pin.
    - name: zmk-nice-oled
      remote: mctechnology17
      revision: main
  self:
    path: config
